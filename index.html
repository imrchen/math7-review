<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>七年級上學期 數學 檢討</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"PingFang TC","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
     color:#17212B;-webkit-text-size-adjust:100%}

body{background:#F4F6F8;padding:0 20px 64px}
.wrap{max-width:860px;margin:0 auto}
header{padding:56px 0 28px;border-bottom:3px solid #0B6E5F;margin-bottom:28px}
h1{margin:0;font-size:32px;letter-spacing:.02em}
.tag{display:block;margin-bottom:10px;color:#0B6E5F;font-size:15px;font-weight:700;letter-spacing:.08em}
.lede{margin:14px 0 0;color:#5E6874;font-size:15px;line-height:1.7}
.grid{display:grid;gap:14px}
.card{display:block;background:#fff;border:1px solid #DFE4E9;border-left:6px solid #0B6E5F;
      border-radius:10px;padding:18px 20px;text-decoration:none;color:inherit;
      transition:box-shadow .15s ease,transform .15s ease}
.card:hover,.card:focus-visible{box-shadow:0 4px 16px rgba(23,33,43,.13);transform:translateY(-1px)}
.card:focus-visible{outline:3px solid #0B6E5F;outline-offset:2px}
.sec{display:block;color:#0B6E5F;font-size:14px;font-weight:700;margin-bottom:6px}
.name{display:block;font-size:21px;font-weight:700;line-height:1.4}
.sub{display:block;margin-top:4px;font-size:16px;color:#17212B;opacity:.75}
.pages{display:inline-block;margin-top:10px;color:#5E6874;font-size:13px}
footer{margin-top:36px;color:#5E6874;font-size:13px;line-height:1.8}
@media (max-width:520px){header{padding-top:36px}h1{font-size:26px}.name{font-size:19px}}

</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="tag">康軒版</span>
      <h1>七年級上學期 數學 檢討</h1>
      <p class="lede">點選要檢討的卷別，用鍵盤 ← → 或點畫面左右兩側翻頁。</p>
    </header>
    <div class="grid">
      <a class="card" href="1-1-synchronized-practice-1/">
        <span class="sec">1-1　負數與數線</span>
        <span class="name">試卷－同步練習 1</span>
        <span class="sub">正數與負數、數線</span>
        <span class="pages">10 頁</span>
      </a>
      <a class="card" href="1-1-synchronized-practice-2/">
        <span class="sec">1-1　負數與數線</span>
        <span class="name">試卷－同步練習 2</span>
        <span class="sub">數的大小、相反數與絕對值</span>
        <span class="pages">9 頁</span>
      </a>
    </div>
    <footer>解答與圖形皆為自行重製，非出版社檔案。僅供本班課堂檢討使用。</footer>
  </div>
</body>
</html>
