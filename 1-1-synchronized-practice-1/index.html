<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>試卷－同步練習 1｜七年級上學期 數學 檢討</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"PingFang TC","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
     color:#17212B;-webkit-text-size-adjust:100%}

body{background:#12181D;color:#E9EDF0;height:100dvh;overflow:hidden;
     display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;
     background:#0E1418;border-bottom:1px solid #26313A;flex:0 0 auto}
.back{display:inline-flex;align-items:center;gap:6px;background:#0B6E5F;color:#fff;
      text-decoration:none;font-size:15px;font-weight:700;white-space:nowrap;
      padding:7px 14px;border-radius:7px;line-height:1.3}
.back:hover{background:#0d8570}
.back:focus-visible{outline:3px solid #fff;outline-offset:2px}
.title{flex:1;font-size:14px;color:#C7D3DC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-variant-numeric:tabular-nums;font-size:14px;color:#9FB4C2;white-space:nowrap}
.btn{background:#1D2830;border:1px solid #33414C;color:#D8E2E9;border-radius:6px;
     padding:5px 11px;font-size:14px;cursor:pointer;line-height:1.4}
.btn:hover{background:#26333D}
.stage{flex:1;position:relative;min-height:0}
img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;
    width:auto;height:auto;display:block}
.zone{position:absolute;top:0;bottom:0;width:38%;cursor:pointer;border:0;background:transparent;
      -webkit-tap-highlight-color:transparent}
.zone.prev{left:0}
.zone.next{right:0}
.zone:disabled{cursor:default}
@media (max-width:520px){.title{display:none}}

</style>
</head>
<body>
  <div class="bar">
    <a class="back" href="../">← 選擇其他卷別</a>
    <span class="title">1-1 負數與數線・試卷－同步練習 1</span>
    <span class="count"><span id="cur">1</span> / 10</span>
    <button class="btn" id="full" type="button">全螢幕</button>
  </div>
  <div class="stage">
    <img id="slide" alt="">
    <button class="zone prev" id="prev" type="button" aria-label="上一頁"></button>
    <button class="zone next" id="next" type="button" aria-label="下一頁"></button>
  </div>
<script>
(function(){
  var files = ["slide-01.png","slide-02.png","slide-03.png","slide-04.png","slide-05.png","slide-06.png","slide-07.png","slide-08.png","slide-09.png","slide-10.png"];
  var total = files.length;
  var img = document.getElementById('slide');
  var cur = document.getElementById('cur');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var i = 0;

  function fromHash(){
    var m = /(?:^|[#&])p=(\d+)/.exec(location.hash);
    var n = m ? parseInt(m[1], 10) : 1;
    return Math.min(Math.max(n, 1), total) - 1;
  }
  function preload(n){
    if (n < 0 || n >= total) return;
    var pre = new Image();
    pre.src = files[n];
  }
  function show(n, push){
    i = Math.min(Math.max(n, 0), total - 1);
    img.src = files[i];
    img.alt = '第 ' + (i + 1) + ' 頁，共 ' + total + ' 頁';
    cur.textContent = i + 1;
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === total - 1;
    if (push !== false) history.replaceState(null, '', '#p=' + (i + 1));
    preload(i + 1);
    preload(i - 1);
  }
  prevBtn.addEventListener('click', function(){ show(i - 1); });
  nextBtn.addEventListener('click', function(){ show(i + 1); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { show(i + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(i - 1); e.preventDefault(); }
    else if (e.key === 'Home') { show(0); }
    else if (e.key === 'End') { show(total - 1); }
    else if (e.key === 'f' || e.key === 'F') { toggleFull(); }
  });
  window.addEventListener('hashchange', function(){ show(fromHash(), false); });

  // 手機翻頁：點左右兩側之外，也支援左右滑動。
  var x0 = null;
  var stage = document.querySelector('.stage');
  stage.addEventListener('touchstart', function(e){ x0 = e.changedTouches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1));
    x0 = null;
  }, {passive:true});

  function toggleFull(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
  document.getElementById('full').addEventListener('click', toggleFull);

  show(fromHash(), false);
})();
</script>
</body>
</html>
